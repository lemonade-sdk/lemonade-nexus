<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21493A"/>
      <stop offset="1" stop-color="#0C1F18"/>
    </linearGradient>
    <linearGradient id="bgSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="520" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD84A" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFD84A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peel" cx="0.36" cy="0.30" r="0.80">
      <stop offset="0" stop-color="#FFF6B0"/>
      <stop offset="0.35" stop-color="#FFE04A"/>
      <stop offset="0.75" stop-color="#F6BC0C"/>
      <stop offset="1" stop-color="#D38F00"/>
    </radialGradient>
    <linearGradient id="peelShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#9A5A00" stop-opacity="0"/>
      <stop offset="1" stop-color="#9A5A00" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1E8A45"/>
      <stop offset="1" stop-color="#6BD27A"/>
    </linearGradient>
    <filter id="blur12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="nodeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3A2400" flood-opacity="0.35"/>
    </filter>
    <path id="lemonShape" d="M -305 0 C -296 -16 -276 -30 -252 -42 C -236 -236 236 -236 252 -42 C 276 -30 296 -16 305 0 C 296 16 276 30 252 42 C 236 236 -236 236 -252 42 C -276 30 -296 16 -305 0 Z"/>
  </defs>

  <!--BACKGROUND-->
  <g id="background" filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgSheen)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
    <circle cx="512" cy="520" r="400" fill="url(#glow)"/>
  </g>
  <!--/BACKGROUND-->

  <!-- Ground shadow -->
  <ellipse cx="512" cy="792" rx="250" ry="26" fill="#000000" opacity="0.38" filter="url(#blur18)"/>

  <!-- Lemon -->
  <g transform="translate(512 528) rotate(-20) scale(0.93)">
    <!-- Leaf + stem -->
    <path d="M 26 -186 C 66 -290 196 -318 276 -270 C 212 -200 112 -168 26 -186 Z" fill="url(#leaf)"/>
    <path d="M 40 -192 C 116 -238 186 -258 256 -268" fill="none" stroke="#14653A" stroke-width="7" stroke-linecap="round" opacity="0.65"/>
    <rect x="-6" y="-206" width="40" height="34" rx="12" fill="#7A5A12" transform="rotate(12 14 -189)"/>
    <!-- Body -->
    <use href="#lemonShape" fill="url(#peel)"/>
    <use href="#lemonShape" fill="url(#peelShade)"/>
    <use href="#lemonShape" fill="none" stroke="#B57600" stroke-opacity="0.35" stroke-width="4"/>
    <!-- Specular highlight -->
    <ellipse cx="-118" cy="-92" rx="112" ry="44" fill="#FFFFFF" opacity="0.45" transform="rotate(-12 -118 -92)" filter="url(#blur12)"/>
    <ellipse cx="-150" cy="-104" rx="34" ry="13" fill="#FFFFFF" opacity="0.75" transform="rotate(-14 -150 -104)"/>
  </g>

  <!-- Mesh (upright) -->
  <g stroke="#123A2D" stroke-linecap="round" fill="none">
    <polygon points="512,394 628,461 628,595 512,662 396,595 396,461" stroke-width="12" stroke-opacity="0.85" stroke-linejoin="round"/>
    <line x1="512" y1="528" x2="512" y2="394" stroke-width="10" stroke-opacity="0.7"/>
    <line x1="512" y1="528" x2="628" y2="461" stroke-width="10" stroke-opacity="0.7"/>
    <line x1="512" y1="528" x2="628" y2="595" stroke-width="10" stroke-opacity="0.7"/>
    <line x1="512" y1="528" x2="512" y2="662" stroke-width="10" stroke-opacity="0.7"/>
    <line x1="512" y1="528" x2="396" y2="595" stroke-width="10" stroke-opacity="0.7"/>
    <line x1="512" y1="528" x2="396" y2="461" stroke-width="10" stroke-opacity="0.7"/>
  </g>
  <g filter="url(#nodeShadow)" fill="#FFFFFF" stroke="#123A2D" stroke-width="10">
    <circle cx="512" cy="394" r="28"/>
    <circle cx="628" cy="461" r="28"/>
    <circle cx="628" cy="595" r="28"/>
    <circle cx="512" cy="662" r="28"/>
    <circle cx="396" cy="595" r="28"/>
    <circle cx="396" cy="461" r="28"/>
  </g>
  <g filter="url(#nodeShadow)">
    <circle cx="512" cy="528" r="50" fill="#123A2D"/>
    <circle cx="512" cy="528" r="22" fill="#FFE04A"/>
  </g>
</svg>
