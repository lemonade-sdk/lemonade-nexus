# Lemonade Nexus fleet OS package lock.
#
# nexus-updater installs exactly these package versions with apt, and nothing
# else. Distribution-driven upgrades are disabled on the fleet (package
# postinst). A change here is an OS update and ships only in a release.
#
# Format: "format 1", then one record per line:
#   package <name> <version> <role>
# role:
#   boot     measured boot chain (kernel, GRUB, shim). A change needs new
#            PCR 8/9 in release/fleet-profile.json, measured on the reference
#            VM, and the updater reboots the server.
#   library  provides a system library that release/fleet-profile.json pins
#            by hash. Update the library hashes in the same change.
#   system   any other pinned package.
#
# Generate the records on the reference VM with scripts/nexus-os-lock, and
# review them with the matching fleet-profile.json change.
#
# Captured 2026-10-25 on nexus-mesh-sn01 (Ubuntu 26.04 LTS); identical on
# all five Tier 1 servers. The kernel is a custom build
# (linux-image-7.1.0-coconut-svsm-tier1+), not an Ubuntu archive package.
format 1
package linux-image-7.1.0-coconut-svsm-tier1+ 7.1.0-coconut-tier1-2 boot
package grub-efi-amd64-signed 1.215+2.14-2ubuntu1 boot
package grub-efi-amd64-bin 2.14-2ubuntu1 boot
package shim-signed 1.59+15.8-0ubuntu2 boot
package libc6 2.43-2ubuntu2.4 library
package libssl3t64 3.5.5-1ubuntu3.7 library
package libstdc++6 16-20260322-1ubuntu1 library
package libgcc-s1 16-20260322-1ubuntu1 library
package zlib1g 1:1.3.dfsg+really1.3.1-1ubuntu3.2 library
package libzstd1 1.5.7+dfsg-3 library
