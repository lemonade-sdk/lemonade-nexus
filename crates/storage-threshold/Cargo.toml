[package]
name = "lemonade-storage-threshold"
version = "0.1.0"
edition = "2021"

[lib]
name = "lemonade_storage_threshold"
crate-type = ["staticlib", "rlib"]

[dependencies]
frost-ristretto255 = "=2.2.0"
frost-core = { version = "=2.2.0", features = ["internals"] }
elastic-elgamal = { version = "=0.3.1", default-features = false, features = ["std", "curve25519-dalek"] }
curve25519-dalek = "=4.1.3"
merlin = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

# `cargo test` runs key generation for up to 50 holders. Unoptimized curve
# arithmetic makes that sweep take minutes. CMake builds the release profile.
[profile.dev.package."*"]
opt-level = 3
