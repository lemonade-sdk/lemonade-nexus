name: Release

# One workflow builds, versions, signs, and publishes a release
# (docs/Design-Auto-Update.md, Phase 1; docs/Releasing.md).
#
#   prepare         refuse any ref but main; pick the date tag and release number,
#                   and the previous date-tagged release
#   server          fleet server binaries in a pinned Ubuntu 24.04 / GCC 13.3
#                   container; the rollout guard; the unsigned approval from
#                   release/fleet-profile.json and the previous approval (none
#                   for the bootstrap release)
#   mixed-version   the previous release's server next to the new one
#                   (mixed-version.yml; skipped for the bootstrap release)
#   native, distro  macOS and other Linux distribution builds and packages
#   sdk             the C ABI SDK shared library (Linux, macOS)
#   flutter         the desktop clients (flutter-clients.yml)
#   measure-boot-chain  optional: compare the reference VM's PCR 8/9 with the
#                   profile (only with the REFERENCE_VM_RUNNER variable)
#   approve         sign the approval (environment "release")
#   server-package  the server .deb with the signed approval
#   publish         manifest.json, its signature (environment "release"),
#                   provenance, the tag, and the GitHub release
#
# The release key (secret RELEASE_SIGNING_KEY) exists only in the "release"
# environment. Only the approve and publish jobs use it, only in their signing
# step, and those jobs download data, not programs: they run scripts from this
# commit and the runner's openssl.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Release
  # Pinned toolchain for the fleet server build (server, server-package). The
  # image digest in their container: lines pins the base system; the Ubuntu
  # snapshot pins every package installed on top of it. Change all three
  # places together.
  UBUNTU_SNAPSHOT: 20261020T000000Z
  GCC_VERSION: 13.3.0
  RUST_TOOLCHAIN: 1.99.1

jobs:
  # =========================================================================
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release_number: ${{ steps.version.outputs.release_number }}
      previous_tag: ${{ steps.previous.outputs.tag }}
      previous_is_first: ${{ steps.previous.outputs.is_first }}
      bootstrap: ${{ steps.previous.outputs.bootstrap }}
    steps:
      - name: Refuse any ref except main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release.yml runs only from refs/heads/main (got ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Compute the date version and release number
        id: version
        run: |
          git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v*' |
            sed 's#.*refs/tags/##' > existing-tags
          python3 scripts/nexus-release-tool next-tag --existing-tags existing-tags >> "$GITHUB_OUTPUT"
          tag=$(grep '^tag=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)
          if grep -qx "$tag" existing-tags; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          echo "Release $tag at ${GITHUB_SHA}"

      # The previous release is the newest published date-tagged release. The
      # vX.Y.Z-alpha releases predate the approval chain and are never one.
      # The bootstrap release (Design-Auto-Update Phase 6) is detected, never
      # selected by hand: no earlier date tag or date-tagged release, and no
      # release/bootstrap-complete. It has no previous release.
      - name: Find the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 200 \
            --json tagName --jq '.[].tagName' > published-tags
          python3 scripts/nexus-release-tool previous --tags published-tags \
            --all-tags existing-tags --bootstrap-marker release/bootstrap-complete \
            --before "$NEW_TAG" >> "$GITHUB_OUTPUT"
          prev=$(grep '^tag=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)
          echo "Previous release: ${prev:-none (bootstrap release)}"

  # =========================================================================
  server:
    needs: prepare
    runs-on: ubuntu-24.04
    container: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
      PREVIOUS_IS_FIRST: ${{ needs.prepare.outputs.previous_is_first }}
      BOOTSTRAP: ${{ needs.prepare.outputs.bootstrap }}
    steps:
      - name: Install the pinned toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # ca-certificates first, from the live archive: the snapshot service is
          # HTTPS only. It does not reach the build output.
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          apt-get update --snapshot "$UBUNTU_SNAPSHOT"
          apt-get install -y --no-install-recommends --snapshot "$UBUNTU_SNAPSHOT" \
            gcc-13 g++-13 gcc g++ make cmake ninja-build pkg-config file git curl \
            python3 dpkg-dev libssl-dev libjson-c-dev libcurl4-openssl-dev uuid-dev
          test "$(gcc -dumpfullversion)" = "$GCC_VERSION"
          test "$(g++ -dumpfullversion)" = "$GCC_VERSION"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Reproducibility: fixed paths in debug info and panics, and a commit
          # timestamp instead of the wall clock.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=OFF \
            -DGIT_TAG_OVERRIDE="$TAG" \
            -DNEXUS_GIT_COMMIT_OVERRIDE="$GITHUB_SHA" \
            -DCMAKE_C_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/src" \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/src"

      - name: Build every target
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Collect server binaries
        run: |
          mkdir -p out
          cp build/projects/LemonadeNexus/lemonade-nexus out/lemonade-nexus-linux-x86_64
          cp build/projects/LemonadeNexusAttestd/nexus-attestd out/nexus-attestd-linux-x86_64
          cp build/projects/LemonadeNexusUpdater/nexus-updater out/nexus-updater-linux-x86_64
          (cd out && sha256sum -- *)

      # The previous approval: its hashes become previous_release_paths, so
      # servers on both releases attest each other. A missing previous
      # approval fails the release; it never falls back to an approval without
      # the overlap. The bootstrap release has no previous release.
      - name: Fetch the previous release's approval and package lock
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p previous
          if [ "$BOOTSTRAP" = "true" ]; then
            echo "::notice::Bootstrap release: there is no previous release"
            exit 0
          fi
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "::error::no previous release, and this is not the bootstrap release"
            exit 1
          fi
          curl -fsSL -o previous/release-approval.json \
            "https://github.com/${GH_REPO}/releases/download/${PREVIOUS_TAG}/release-approval.json"
          curl -fsSL -o previous/os-packages.lock \
            "https://github.com/${GH_REPO}/releases/download/${PREVIOUS_TAG}/os-packages.lock"
          ls -l previous

      # Each approval lists the previous release's hashes. Publishing while
      # the previous rollout is open would drop the servers still on the
      # release before it out of attestation, so the guard requires Tier 1
      # finalized state: a rollout proof (GET /api/upgrade/rollout-proof from
      # any server in ROLLOUT_PROOF_URLS) that verifies from the Genesis key
      # behind the profile's network id. The rollout must be complete, or
      # halted: after a halt, servers run the halted release or the release
      # before it, and the new approval must list both (checked again after
      # the approval is built). The servers are not trusted for the proof.
      # See docs/Releasing.md.
      - name: Check the previous rollout
        id: rollout
        env:
          ROLLOUT_PROOF_URLS: ${{ vars.ROLLOUT_PROOF_URLS }}
        run: |
          mkdir -p rollout
          if [ "$BOOTSTRAP" = "true" ]; then
            echo "::notice::Bootstrap release: no previous rollout to check"
            echo "state=bootstrap" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PREVIOUS_IS_FIRST" = "true" ]; then
            # The bootstrap release is installed by hand (Phase 6) and has no
            # rollout records. A reviewed commit records its completion.
            if [ "$(tr -d '[:space:]' < release/bootstrap-complete 2>/dev/null)" != "$PREVIOUS_TAG" ]; then
              echo "::error::release/bootstrap-complete must name $PREVIOUS_TAG once every server runs it"
              exit 1
            fi
            echo "::notice::The bootstrap release $PREVIOUS_TAG is recorded as complete"
            echo "state=complete" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$ROLLOUT_PROOF_URLS" ]; then
            echo "::error::set the repository variable ROLLOUT_PROOF_URLS; the rollout of $PREVIOUS_TAG cannot be checked"
            exit 1
          fi
          network=$(python3 -c 'import json; print(json.load(open("release/fleet-profile.json"))["network_id"])')
          number=$(python3 scripts/nexus-release-tool release-number --tag "$PREVIOUS_TAG")
          for url in $ROLLOUT_PROOF_URLS; do
            rm -f rollout/rollout-proof.json rollout/state
            if ! curl -fsS --proto '=https' --max-time 30 --max-filesize 8388608 \
                -o rollout/rollout-proof.json "$url"; then
              echo "::warning::no rollout proof from $url"
              continue
            fi
            if build/projects/LemonadeNexus/nexus-rollout-check --network-id "$network" \
                --release "$number" --proof rollout/rollout-proof.json \
                --previous-approval previous/release-approval.json --print-state > rollout/state; then
              state=$(sed -n 's/^rollout=//p' rollout/state)
              case "$state" in
                complete|halted) ;;
                *) echo "::error::unexpected rollout state '$state'"; exit 1 ;;
              esac
              if [ "$state" = "halted" ]; then
                echo "::warning::The rollout of $PREVIOUS_TAG halted; this release must list the hashes of $PREVIOUS_TAG and of the release before it"
              fi
              echo "state=$state" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          rm -f rollout/rollout-proof.json
          echo "::error::no server proved the rollout of $PREVIOUS_TAG complete or halted; refusing to publish"
          exit 1

      - name: Generate the unsigned approval
        env:
          ROLLOUT_STATE: ${{ steps.rollout.outputs.state }}
        run: |
          python3 scripts/nexus-release-tool spec \
            --profile release/fleet-profile.json --tag "$TAG" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --nexus out/lemonade-nexus-linux-x86_64 --attestd out/nexus-attestd-linux-x86_64 \
            --out approval-spec.json
          previous_args=()
          case "$ROLLOUT_STATE" in
            bootstrap) ;;
            complete) previous_args=(--previous-approval previous/release-approval.json) ;;
            halted) previous_args=(--previous-approval previous/release-approval.json --previous-halted) ;;
            *) echo "::error::unknown rollout state '$ROLLOUT_STATE'"; exit 1 ;;
          esac
          mkdir -p approval
          build/projects/LemonadeNexus/nexus-release-bundle --spec approval-spec.json \
            "${previous_args[@]}" \
            --out approval/release-approval.unsigned.json \
            --approval-preimage approval/approval.preimage
          cp approval-spec.json approval/
          cp -r previous approval/previous

      # The approval must carry exactly the overlap the proven rollout state
      # requires: the previous release after a completed rollout, the halted
      # release and the release before it after a halt.
      - name: Check the approval against the previous rollout
        run: |
          if [ ! -f rollout/rollout-proof.json ]; then
            echo "::notice::No rollout proof (bootstrap release, or the release after it)"
            exit 0
          fi
          network=$(python3 -c 'import json; print(json.load(open("release/fleet-profile.json"))["network_id"])')
          number=$(python3 scripts/nexus-release-tool release-number --tag "$PREVIOUS_TAG")
          build/projects/LemonadeNexus/nexus-rollout-check --network-id "$network" \
            --release "$number" --proof rollout/rollout-proof.json \
            --previous-approval previous/release-approval.json \
            --approval approval/release-approval.unsigned.json

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            out/lemonade-nexus-linux-x86_64
            out/nexus-attestd-linux-x86_64
            out/nexus-updater-linux-x86_64

      - name: Name the provenance bundles after the assets
        run: |
          for f in out/*-linux-x86_64; do
            cp "${{ steps.attest.outputs.bundle-path }}" "out/$(basename "$f").sigstore.json"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: server-binaries
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-approval
          path: approval/
          if-no-files-found: error

      # server-package reuses this tree: it adds the signed approval and runs
      # CPack without recompiling, then checks the binary hashes again.
      - uses: actions/cache/save@v5
        with:
          path: build
          key: release-server-build-${{ github.run_id }}-${{ github.run_attempt }}

  # =========================================================================
  # Phase 3 gate: the previous release's server next to this commit's. The
  # bootstrap release has no previous release, so the gate is skipped; every
  # server installs it by hand on a fresh founding (docs/Releasing.md).
  mixed-version:
    needs: prepare
    if: needs.prepare.outputs.bootstrap != 'true' && needs.prepare.outputs.previous_tag != ''
    uses: ./.github/workflows/mixed-version.yml
    with:
      previous_tag: ${{ needs.prepare.outputs.previous_tag }}

  # =========================================================================
  native:
    needs: prepare
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-macos-14-ninja-${{ hashFiles('cmake/libraries/*.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-macos-14-ninja-

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=OFF \
            -DGIT_TAG_OVERRIDE="$TAG" \
            -DOPENSSL_FORCE_BUNDLED=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Verify no Homebrew linkage
        run: |
          status=0
          while IFS= read -r bin; do
            deps=$(otool -L "$bin" 2>/dev/null | tail -n +2 | grep -E '/opt/homebrew/|/usr/local/' || true)
            if [ -n "$deps" ]; then
              echo "::error::$bin links against Homebrew/local libraries:"
              echo "$deps"
              status=1
            fi
          done < <(find build/projects -type f -perm +111)
          exit $status

      - name: Package
        run: |
          cpack --config build/CPackConfig.cmake -G productbuild -B build/packages
          mkdir -p out
          cp build/projects/LemonadeNexus/lemonade-nexus "out/lemonade-nexus-${TAG}-darwin-arm64"
          cp build/packages/*.pkg out/

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: out/*

      - uses: actions/upload-artifact@v4
        with:
          name: native-darwin-arm64
          path: out/
          if-no-files-found: error

  # =========================================================================
  distro:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - container: fedora:40
            platform: linux-x86_64-rpm
            cpack_generators: "RPM"
            install_cmd: >-
              dnf install -y cmake ninja-build make gcc-c++ openssl-devel
              pkgconf-pkg-config json-c-devel libcurl-devel libuuid-devel git
              python3 rpm-build
          - container: archlinux:latest
            platform: linux-x86_64-arch
            cpack_generators: "TGZ"
            install_cmd: >-
              pacman -Syu --noconfirm cmake ninja make gcc openssl pkgconf json-c curl util-linux-libs git python
          - container: amazonlinux:2023
            platform: linux-x86_64-amzn2023
            cpack_generators: "RPM"
            # Same toolchain notes as ci.yml: GCC 14 and a pinned PyPI CMake.
            install_cmd: >-
              dnf install -y ninja-build make gcc14 gcc14-c++ openssl-devel
              pkgconf-pkg-config json-c-devel libcurl-devel libuuid-devel git
              ca-certificates tar gzip python3 python3-pip rpm-build &&
              ln -sf /usr/bin/gcc14-gcc /usr/local/bin/gcc &&
              ln -sf /usr/bin/gcc14-gcc /usr/local/bin/cc &&
              ln -sf /usr/bin/gcc14-g++ /usr/local/bin/g++ &&
              ln -sf /usr/bin/gcc14-g++ /usr/local/bin/c++ &&
              pip3 install 'cmake==3.31.6'
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Install dependencies
        run: ${{ matrix.install_cmd }}

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=OFF \
            -DGIT_TAG_OVERRIDE="$TAG"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package
        run: |
          for gen in ${{ matrix.cpack_generators }}; do
            cpack --config build/CPackConfig.cmake -G "$gen" -B build/packages
          done
          mkdir -p out
          cp build/projects/LemonadeNexus/lemonade-nexus "out/lemonade-nexus-${TAG}-${{ matrix.platform }}"
          for f in build/packages/*.rpm build/packages/*.tar.gz; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            # CPack names the Fedora and Amazon Linux RPMs alike; keep both.
            case "${{ matrix.platform }}" in
              *amzn2023) cp "$f" "out/${base%.rpm}.amzn2023.rpm" ;;
              *) cp "$f" out/ ;;
            esac
          done

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: out/*

      - uses: actions/upload-artifact@v4
        with:
          name: distro-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  # =========================================================================
  sdk:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            library: liblemonade_nexus_sdk.so
          - os: macos-14
            platform: darwin-arm64
            library: liblemonade_nexus_sdk.dylib
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev pkg-config libjson-c-dev libcurl4-openssl-dev uuid-dev

      - name: Build the shared SDK
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=OFF \
            -DBUILD_SDK_SHARED=ON \
            -DGIT_TAG_OVERRIDE="$TAG" \
            -DOPENSSL_FORCE_BUNDLED=${{ runner.os == 'macOS' && 'ON' || 'OFF' }}
          cmake --build build --target LemonadeNexusSDKShared --parallel
          mkdir -p out
          cp "build/projects/LemonadeNexusSDK/${{ matrix.library }}" \
            "out/lemonade-nexus-sdk-${TAG}-${{ matrix.platform }}-${{ matrix.library }}"

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: out/*

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  # =========================================================================
  flutter:
    needs: prepare
    # The called jobs declare contents: write for their own release upload,
    # which stays off here: release_tag is empty, so they only build.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-clients.yml
    with:
      release_tag: ''

  # =========================================================================
  # Measurement hook. A GitHub-hosted runner cannot boot the fleet's SEV-SNP
  # guest, so it cannot measure PCR 8/9. When the repository variable
  # REFERENCE_VM_RUNNER names the label of a runner on the reference VM, this
  # job reads that VM's PCR 8/9 and fails the release unless they equal
  # release/fleet-profile.json. Without the variable it is skipped, and the
  # PCRs come only from the reviewed profile (docs/Releasing.md).
  measure-boot-chain:
    needs: prepare
    if: vars.REFERENCE_VM_RUNNER != ''
    runs-on: ${{ vars.REFERENCE_VM_RUNNER }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Compare the reference VM's PCR 8/9 with the profile
        run: scripts/nexus-measure-boot-chain --compare release/fleet-profile.json

  # =========================================================================
  approve:
    needs: [prepare, server, measure-boot-chain]
    # Runs when the measurement hook passed or is not configured.
    if: >-
      !cancelled() && needs.server.result == 'success' &&
      (needs.measure-boot-chain.result == 'success' || needs.measure-boot-chain.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    outputs:
      boot_chain_changed: ${{ steps.boot.outputs.boot_chain_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: unsigned-approval
          path: approval

      - name: Check the boot chain against the profile
        id: boot
        run: |
          python3 scripts/nexus-release-tool boot-chain \
            --profile release/fleet-profile.json --lock release/os-packages.lock \
            --previous-lock approval/previous/os-packages.lock \
            --previous-approval approval/previous/release-approval.json >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Sign the approval
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          signer=$(python3 -c 'import json; print(json.load(open("release/fleet-profile.json"))["release_signer"])')
          python3 scripts/nexus-release-sign --in approval/approval.preimage \
            --out approval/approval.sig --expect-pubkey "$signer"

      - name: Assemble the signed approval
        run: |
          mkdir -p signed
          python3 scripts/nexus-release-tool assemble --profile release/fleet-profile.json \
            --bundle approval/release-approval.unsigned.json \
            --signature approval/approval.sig --out signed/release-approval.json
          cp approval/approval.preimage signed/

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: signed/release-approval.json

      - run: cp "${{ steps.attest.outputs.bundle-path }}" signed/release-approval.json.sigstore.json

      - uses: actions/upload-artifact@v4
        with:
          name: signed-approval
          path: signed/
          if-no-files-found: error

  # =========================================================================
  server-package:
    needs: [prepare, server, approve]
    if: ${{ !cancelled() && needs.approve.result == 'success' }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Install the pinned toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          apt-get update --snapshot "$UBUNTU_SNAPSHOT"
          apt-get install -y --no-install-recommends --snapshot "$UBUNTU_SNAPSHOT" \
            gcc-13 g++-13 gcc g++ make cmake ninja-build pkg-config file git curl \
            python3 dpkg-dev libssl-dev libjson-c-dev libcurl4-openssl-dev uuid-dev
          test "$(gcc -dumpfullversion)" = "$GCC_VERSION"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/cache/restore@v5
        with:
          path: build
          key: release-server-build-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v4
        with:
          name: signed-approval
          path: signed

      - uses: actions/download-artifact@v4
        with:
          name: server-binaries
          path: binaries

      - name: Package with the signed approval
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Reconfigure for the approval file only. Nothing is rebuilt: the
          # fresh checkout is newer than the cached objects, and CPack would
          # otherwise build "all" before it installs.
          cmake -S . -B build \
            -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON \
            -DLEMONADE_RELEASE_APPROVAL_FILE="$GITHUB_WORKSPACE/signed/release-approval.json"
          # The packaged binaries must be the approved bytes.
          cmp build/projects/LemonadeNexus/lemonade-nexus binaries/lemonade-nexus-linux-x86_64
          cmp build/projects/LemonadeNexusAttestd/nexus-attestd binaries/nexus-attestd-linux-x86_64
          cpack --config build/CPackConfig.cmake -G DEB -B build/packages
          mkdir -p out
          cp build/packages/*.deb out/

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: out/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: server-deb
          path: out/
          if-no-files-found: error

  # =========================================================================
  publish:
    needs: [prepare, server, mixed-version, native, distro, sdk, flutter, approve, server-package]
    if: ${{ !cancelled() && !failure() && needs.server-package.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_NUMBER: ${{ needs.prepare.outputs.release_number }}
      BOOT_CHAIN_CHANGED: ${{ needs.approve.outputs.boot_chain_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the release assets
        run: |
          mkdir -p dist
          for dir in server-binaries native-darwin-arm64 distro-linux-x86_64-rpm \
                     distro-linux-x86_64-arch distro-linux-x86_64-amzn2023 \
                     sdk-linux-x86_64 sdk-darwin-arm64 server-deb; do
            cp artifacts/"$dir"/* dist/
          done
          cp artifacts/signed-approval/release-approval.json dist/
          cp artifacts/signed-approval/release-approval.json.sigstore.json dist/
          cp release/os-packages.lock dist/os-packages.lock
          # Desktop clients: zip each app directory.
          for client in artifacts/nexus-client-*; do
            [ -d "$client" ] || continue
            name=$(basename "$client")
            (cd "$client" && zip -qr "$GITHUB_WORKSPACE/dist/${name}-${TAG}.zip" .)
          done
          ls -l dist

      - name: Write the manifest
        run: |
          python3 scripts/nexus-release-tool manifest \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$GITHUB_SHA" \
            --approval dist/release-approval.json \
            --approval-preimage artifacts/signed-approval/approval.preimage \
            --lock dist/os-packages.lock --boot-chain-changed "$BOOT_CHAIN_CHANGED" \
            --server-file lemonade-nexus-linux-x86_64=/usr/bin/lemonade-nexus=dist/lemonade-nexus-linux-x86_64 \
            --server-file nexus-attestd-linux-x86_64=/usr/bin/nexus-attestd=dist/nexus-attestd-linux-x86_64 \
            --artifacts-dir dist --out manifest.json
          test "$(python3 -c 'import json; print(json.load(open("manifest.json"))["release_number"])')" = "$RELEASE_NUMBER"

      - name: Sign the manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          signer=$(python3 -c 'import json; print(json.load(open("release/fleet-profile.json"))["release_signer"])')
          python3 scripts/nexus-release-sign --in manifest.json --out manifest.json.sig \
            --expect-pubkey "$signer" --domain $'lemonade-nexus/release-manifest/v1\n'
          mv manifest.json manifest.json.sig dist/

      - name: Attest the manifest and the package lock
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/manifest.json
            dist/os-packages.lock

      - run: |
          cp "${{ steps.attest.outputs.bundle-path }}" dist/manifest.json.sigstore.json
          cp "${{ steps.attest.outputs.bundle-path }}" dist/os-packages.lock.sigstore.json

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null; then
            echo "::error::tag ${TAG} already exists"
            exit 1
          fi
          cat > notes.md <<EOF
          Release ${TAG} (release number ${RELEASE_NUMBER}), built from ${GITHUB_SHA} by release.yml on main.

          - Servers update in place through nexus-updater. It verifies release-approval.json and manifest.json.sig against the Genesis-delegated release key, every file hash, and the Sigstore provenance (*.sigstore.json).
          - Operators can check provenance with: gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main
          - Fresh installs: see docs/Getting-Started.md.
          EOF
          # --latest: nexus-updater reads the latest release.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file notes.md --latest dist/*
