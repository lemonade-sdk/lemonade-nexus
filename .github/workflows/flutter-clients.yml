name: Flutter Desktop Clients

# Builds the self-contained native SDK shared library and the Flutter desktop
# client (apps/LemonadeNexusClient) on macOS, Windows and Linux, and runs
# analyze + tests. When a release tag is supplied (a published release, or the
# release_tag input of a manual run), each job also packages its app and
# attaches it to that GitHub release. Signed installers (DMG / MSIX) are
# layered on top of these artifacts separately.

on:
  push:
    branches: [main, client-port-flutter]
    paths:
      - 'apps/LemonadeNexusClient/**'
      - 'projects/LemonadeNexusSDK/**'
      - 'projects/LemonadeNexus/src/Boringtun/**'
      - 'cmake/**'
      - 'crates/**'
      - '.github/workflows/flutter-clients.yml'
  pull_request:
    paths:
      - 'apps/LemonadeNexusClient/**'
      - 'projects/LemonadeNexusSDK/**'
      - 'cmake/**'
      - '.github/workflows/flutter-clients.yml'
  release:
    types: [published]
  # release.yml calls this workflow to build the clients for a release. It
  # passes an empty release_tag and attaches the artifacts itself.
  workflow_call:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the built apps to (empty: build only)'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the built apps to (leave empty to only build)'
        required: false
        default: ''
        type: string

env:
  BUILD_TYPE: Release
  # Release to attach the packaged apps to; empty means build only.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  FLUTTER_VERSION: "3.44.4"
  # Keep pub downloads inside the workspace so actions/cache can persist them.
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write  # gh release upload
    steps:
      - uses: actions/checkout@v5

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-macos-14-${{ hashFiles('cmake/libraries/*.cmake', 'CMakeLists.txt') }}
          restore-keys: fetchcontent-macos-14-

      - name: Install Ninja
        run: brew install ninja

      # CMake downloads and links the pinned static OpenSSL archive.
      - name: Build shared SDK
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=OFF \
            -DBUILD_SDK_SHARED=ON
          cmake --build build --target LemonadeNexusSDKShared --parallel

      - name: Verify SDK dylib is self-contained
        run: |
          dylib=build/projects/LemonadeNexusSDK/liblemonade_nexus_sdk.dylib
          # Sanity floor: the public C API is ~64 ln_* functions. Catches a dylib
          # that built but failed to export the API (Flutter FFI would break at runtime).
          test "$(nm -gU "$dylib" | grep -c ' _ln_')" -ge 60
          # Must run on machines without Homebrew: OpenSSL etc. are statically bundled,
          # so the dylib must not link OpenSSL or anything under /opt/homebrew or /usr/local.
          if otool -L "$dylib" | tail -n +2 | grep -E '/opt/homebrew/|/usr/local/|libssl|libcrypto'; then
            echo "::error::SDK dylib links Homebrew/local or OpenSSL shared libraries — not self-contained"; exit 1
          fi

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/LemonadeNexusClient/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Analyze + test
        working-directory: apps/LemonadeNexusClient
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build macOS app
        working-directory: apps/LemonadeNexusClient
        run: flutter build macos --release

      # The Xcode embed phase warns-and-continues when the dylib is missing;
      # fail loudly here instead of shipping an app that cannot load the SDK.
      - name: Verify app bundle embeds the SDK dylib
        run: |
          app=$(ls -d apps/LemonadeNexusClient/build/macos/Build/Products/Release/*.app | head -n 1)
          test -f "$app/Contents/Frameworks/liblemonade_nexus_sdk.dylib"

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-client-macos
          path: apps/LemonadeNexusClient/build/macos/Build/Products/Release/*.app

      - name: Attach to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          app=$(find apps/LemonadeNexusClient/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          out="nexus-client-${RELEASE_TAG}-macos-arm64-unsigned.zip"
          ditto -c -k --keepParent "$app" "$out"
          gh release upload "$RELEASE_TAG" "$out" --clobber

  windows:
    runs-on: windows-2022
    permissions:
      contents: write  # gh release upload
    steps:
      - uses: actions/checkout@v5

      # FetchContent sub-builds record their CMake generator, so the key names
      # the workflow and generator: the old `fetchcontent-windows-2022-` prefix
      # also matched ci.yml's Visual Studio caches, which then aborted asio's
      # sub-build under this job's Ninja configure.
      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-flutter-windows-2022-ninja-${{ hashFiles('cmake/libraries/*.cmake', 'CMakeLists.txt') }}
          restore-keys: fetchcontent-flutter-windows-2022-ninja-

      # CMake downloads and links the pinned static OpenSSL archive.
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build shared SDK
        shell: pwsh
        run: |
          # The FFI DLL uses the dynamic CRT (/MD), like the Flutter runner.
          # The OpenSSL archive is built /MT /Zl, so it links into /MD code.
          cmake -B build -G Ninja `
            "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}" `
            -DBUILD_TESTING=OFF `
            -DBUILD_SDK_SHARED=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          cmake --build build --target LemonadeNexusSDKShared --parallel

      # Windows counterpart of the macOS nm check: the public C API is ~64
      # ln_* functions; a DLL that built but failed to export them would only
      # fail at Flutter FFI runtime.
      - name: Verify SDK DLL exports
        shell: pwsh
        run: |
          $exports = dumpbin /exports build/projects/LemonadeNexusSDK/lemonade_nexus_sdk.dll
          $n = ($exports | Select-String '\bln_[a-z0-9_]+').Count
          if ($n -lt 60) { Write-Error "only $n ln_* exports — expected >= 60"; exit 1 }
          Write-Output "ln_* exports: $n"
          # OpenSSL is linked statically, so the DLL must not import an OpenSSL DLL.
          $deps = dumpbin /dependents build/projects/LemonadeNexusSDK/lemonade_nexus_sdk.dll
          $deps
          if ($deps | Select-String -Pattern 'libssl|libcrypto') { Write-Error "the SDK DLL imports an OpenSSL DLL"; exit 1 }

      # The Windows CMake install step bundles the DLL from a Release/
      # subdir; Ninja is single-config, so stage it there.
      - name: Stage SDK DLL for the runner
        shell: pwsh
        run: |
          $rel = "build/projects/LemonadeNexusSDK/Release"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          Copy-Item "build/projects/LemonadeNexusSDK/lemonade_nexus_sdk.dll" $rel -Force
          Copy-Item "projects/LemonadeNexusSDK/include/LemonadeNexusSDK/lemonade_nexus.h" $rel -Force

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/LemonadeNexusClient/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Analyze + test
        working-directory: apps/LemonadeNexusClient
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Windows app
        working-directory: apps/LemonadeNexusClient
        run: flutter build windows --release

      # The install-step bundle assembly could silently regress (it has
      # before); assert the runtime-critical pieces made it next to the exe.
      - name: Verify Windows bundle is complete
        shell: pwsh
        run: |
          $bundle = "apps/LemonadeNexusClient/build/windows/x64/runner/Release"
          $required = @(
            "nexus-client.exe",
            "flutter_windows.dll",
            "lemonade_nexus_sdk.dll",
            "data/icudtl.dat",
            "data/app.so",
            "data/flutter_assets"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $bundle $_)) }
          if ($missing) { Write-Error "bundle missing: $($missing -join ', ')"; exit 1 }
          $plugins = (Get-ChildItem $bundle -Filter '*_plugin.dll').Count
          if ($plugins -lt 3) { Write-Error "only $plugins plugin DLLs — expected >= 3"; exit 1 }
          Write-Output "bundle complete ($plugins plugin DLLs)"

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-client-windows
          path: apps/LemonadeNexusClient/build/windows/x64/runner/Release/

      - name: Attach to release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $stage = "dist/nexus-client"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item -Recurse "apps/LemonadeNexusClient/build/windows/x64/runner/Release" $stage
          $out = "nexus-client-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $out -Force
          gh release upload "$env:RELEASE_TAG" $out --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # gh release upload
    steps:
      - uses: actions/checkout@v5

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-flutter-ubuntu-24.04-ninja-${{ hashFiles('cmake/libraries/*.cmake', 'CMakeLists.txt') }}
          restore-keys: fetchcontent-flutter-ubuntu-24.04-ninja-

      # SDK: cmake + ninja (Rust is preinstalled on the runner). Flutter Linux
      # toolchain: clang + GTK 3. Plugins: libsecret + jsoncpp
      # (flutter_secure_storage), ayatana appindicator (tray_manager).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config clang libssl-dev \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev

      # The pinned OpenSSL static libraries of libssl-dev are linked in
      # (LEMONADE_NEXUS_STATIC_DEPS), so the .so carries no libssl/libcrypto
      # dependency. The SDK does not use TPM FAPI, so skip the tss2
      # dependency chain.
      - name: Build shared SDK
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=OFF \
            -DLEMONADE_NEXUS_MINIMAL_DEPS=ON \
            -DBUILD_SDK_SHARED=ON
          cmake --build build --target LemonadeNexusSDKShared --parallel

      - name: Verify SDK .so exports and is self-contained
        run: |
          so=build/projects/LemonadeNexusSDK/liblemonade_nexus_sdk.so
          # Sanity floor: the public C API is ~64 ln_* functions.
          n=$(nm -D --defined-only "$so" | grep -c ' T ln_')
          echo "ln_* exports: $n"
          test "$n" -ge 60
          # Static deps (OpenSSL, libsodium, ...) must be embedded, not linked.
          if ldd "$so" | grep -E 'libssl|libcrypto|libsodium|not found'; then
            echo "::error::SDK .so links non-system libraries"; exit 1
          fi

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/LemonadeNexusClient/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Analyze + test
        working-directory: apps/LemonadeNexusClient
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Linux app
        working-directory: apps/LemonadeNexusClient
        run: flutter build linux --release

      # The runner's install step bundles the SDK OPTIONALly (warning only);
      # assert the runtime-critical pieces made it into the bundle.
      - name: Verify Linux bundle is complete
        run: |
          bundle=apps/LemonadeNexusClient/build/linux/x64/release/bundle
          test -x "$bundle/nexus-client"
          test -f "$bundle/lib/liblemonade_nexus_sdk.so"
          test -f "$bundle/lib/libapp.so"
          test -f "$bundle/lib/libflutter_linux_gtk.so"
          test -f "$bundle/data/icudtl.dat"
          test -d "$bundle/data/flutter_assets"
          plugins=$(find "$bundle/lib" -name '*_plugin.so' | wc -l)
          echo "plugin libraries: $plugins"
          test "$plugins" -ge 3
          if ldd "$bundle/nexus-client" | grep 'not found'; then
            echo "::error::bundle executable has unresolved libraries"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-client-linux
          path: apps/LemonadeNexusClient/build/linux/x64/release/bundle/

      - name: Attach to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          cp -a apps/LemonadeNexusClient/build/linux/x64/release/bundle dist/nexus-client
          out="nexus-client-${RELEASE_TAG}-linux-x86_64.tar.gz"
          tar -czf "$out" -C dist nexus-client
          gh release upload "$RELEASE_TAG" "$out" --clobber
